<!doctype html>
<html>
<head><meta charset="utf-8"><title>waiting</title></head>
<body style="margin:0;height:100vh;background:#444">
<script>
const frames = 30;

async function share() {
  document.title = "sharing";
  try {
    const stream = await navigator.mediaDevices.getDisplayMedia({video: true});
    const video = document.createElement("video");
    video.muted = true;
    video.srcObject = stream;
    await video.play();
    let seen = 0;
    const count = () => {
      seen++;
      if (seen < frames) {
        video.requestVideoFrameCallback(count);
        return;
      }
      document.title = `shared ${video.videoWidth}x${video.videoHeight} after ${seen} frames`;
    };
    video.requestVideoFrameCallback(count);
  } catch (e) {
    document.title = `failed ${e.name}: ${e.message}`;
  }
}

addEventListener("keydown", share, {once: true});
</script>
</body>
</html>
